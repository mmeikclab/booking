<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Şifre Belirle</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background-color: #3b82f6; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #1e293b; text-align: center; margin-bottom: 20px;">Yeni Şifrenizi Belirleyin</h2>
        <input type="password" id="yeniSifre" placeholder="Yeni Şifre">
        <input type="password" id="yeniSifreTekrar" placeholder="Yeni Şifre (Tekrar)">
        <button onclick="sifreyiKaydet()">Şifreyi Güncelle</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
    <script>
        const { Client, Account } = Appwrite;
        const client = new Client()
            .setEndpoint('https://fra.cloud.appwrite.io/v1')
            .setProject('6a9c491d0023fea6607e');
        const account = new Account(client);

        // URL'den Appwrite'ın gönderdiği güvenlik kodlarını alıyoruz
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const secret = urlParams.get('secret');

        async function sifreyiKaydet() {
            const sifre = document.getElementById('yeniSifre').value;
            const tekrar = document.getElementById('yeniSifreTekrar').value;

            if (sifre !== tekrar) return alert("Şifreler birbiriyle uyuşmuyor!");
            if (!userId || !secret) return alert("Geçersiz veya süresi dolmuş bağlantı!");

            try {
                await account.updateRecovery(userId, secret, sifre, tekrar);
                alert("Şifreniz başarıyla güncellendi! Artık giriş yapabilirsiniz.");
                window.location.href = "index.html";
            } catch (error) {
                alert("Şifre güncellenirken hata oluştu: " + error.message);
            }
        }
    </script>
</body>
</html>
